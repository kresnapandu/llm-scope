[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmscope-kresnapandu"
version = "0.1.0"
description = "Self-hostable LLM observability SDK — trace, cost, and hallucination monitoring in one line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "llm-scope contributors" }]
keywords = ["llm", "observability", "opentelemetry", "tracing", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "wrapt>=1.15.0",
    "tiktoken>=0.5.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
all = ["langchain-core>=0.1.0", "fastapi>=0.100.0", "starlette>=0.27.0"]

[project.urls]
Homepage = "https://github.com/yourusername/llm-scope"
Repository = "https://github.com/yourusername/llm-scope"
Issues = "https://github.com/yourusername/llm-scope/issues"

[tool.hatch.version]
path = "llmscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["llmscope"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
