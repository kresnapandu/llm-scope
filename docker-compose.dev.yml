version: "3.9"

# Development overrides — mount source for hot reload
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"   # Expose for local inspection

  redis:
    ports:
      - "6379:6379"   # Expose for local inspection

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-llmscope}:${POSTGRES_PASSWORD:-llmscope}@postgres/llmscope
      REDIS_URL: redis://redis:6379
      JUDGE_MODEL: ${JUDGE_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHONDONTWRITEBYTECODE: "1"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/index.html:/app/index.html
      - ./dashboard/vite.config.js:/app/vite.config.js
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
