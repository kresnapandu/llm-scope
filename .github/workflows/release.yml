name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-pypi:
    name: Publish SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hatch
        run: pip install hatch

      - name: Build package
        run: cd sdk && hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist/
          password: ${{ secrets.PYPI_TOKEN }}

  publish-docker-backend:
    name: Publish Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-scope-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-scope-backend:${{ github.ref_name }}

  publish-docker-dashboard:
    name: Publish Dashboard Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-scope-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-scope-dashboard:${{ github.ref_name }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: sdk/dist/
        continue-on-error: true

      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: sdk/dist/*
